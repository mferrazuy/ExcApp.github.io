<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIT Timer Pro</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* --- ESTILOS DINÁMICOS DE FONDO --- */
        body { 
            font-family: sans-serif; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
            transition: background-color 0.5s ease; /* Transición suave de color */
        }

        /* Colores de fondo según estado */
        .bg-menu { background-color: #1a1a1a; }
        .bg-work { background-color: #064e3b; } /* Verde oscuro intenso */
        .bg-rest { background-color: #7f1d1d; } /* Rojo oscuro intenso */
        .bg-config { background-color: #1e3a8a; } /* Azul oscuro */

        /* Utilidades */
        .hidden { display: none; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 5px; width: 100%; font-size: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-green { background: #4ade80; color: #003300; }
        .btn-red { background: #f87171; color: #450a0a; }
        .btn-blue { background: #60a5fa; color: #1e3a8a; }
        .btn-gray { background: #4b5563; color: white; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.5); color: #eee; }
        
        /* Timer Styles */
        .timer-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .big-text { font-size: 7rem; font-weight: bold; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .exercise-name { font-size: 2.8rem; margin-bottom: 20px; word-wrap: break-word; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        
        /* Form & Menu Styles */
        .scroll-container { max-width: 600px; margin: 0 auto; width: 100%; overflow-y: auto; flex: 1; }
        .input-group { margin-bottom: 10px; display: flex; gap: 10px; }
        input, select { padding: 12px; border-radius: 5px; border: 1px solid #555; background: rgba(0,0,0,0.3); color: white; width: 100%; font-size: 1rem; }
        input::placeholder { color: #aaa; }
        
        .item-lista { background: rgba(255,255,255,0.1); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(5px); }
        .tag { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.5); margin-right: 5px; }
    </style>
</head>

<body :class="{
    'bg-menu': modo === 'menu',
    'bg-config': modo === 'config',
    'bg-work': modo === 'timer' && ejercicioActivo.tipo === 'work',
    'bg-rest': modo === 'timer' && ejercicioActivo.tipo === 'rest'
}" x-data="app()">

    <div class="app-wrapper" style="height: 100%; display: flex; flex-direction: column;">
        <!-- Pantalla de Menú (Lista de Rutinas) -->
        <div x-show="modo === 'menu'" class="scroll-container">
            <h2 style="text-align: center; margin-bottom: 30px;">Mis Rutinas</h2>
            <template x-for="(rutina, index) in todasLasRutinas" :key="index">
                <div class="item-lista">
                    <div @click="cargarRutina(index)" style="flex-grow: 1; cursor: pointer;">
                        <strong x-text="rutina.nombre" style="font-size: 1.2rem;"></strong>
                        <div style="font-size: 0.9em; color: #ddd; margin-top: 5px;">
                            <span x-text="rutina.ejercicios.length + ' ejercicios'"></span>
                        </div>
                    </div>
                    <button @click.stop="borrarRutina(index)" style="background: none; border: none; color: #fca5a5; font-size: 1.2rem; padding: 10px;">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </template>
            <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
                <div class="input-group">
                    <input type="text" x-model="nombreNuevaRutina" placeholder="Nombre nueva rutina...">
                    <button @click="crearRutina()" class="btn btn-green" style="width: auto;">Crear</button>
                </div>
            </div>
        </div>

        <!-- Pantalla del Temporizador -->
        <div x-show="modo === 'timer'" class="timer-container">
            <div style="position: absolute; top: 20px; font-size: 1rem; opacity: 0.8;" x-text="nombreRutinaActual"></div>

            <div class="exercise-name">
                <span x-text="ejercicioActivo.nombre"></span>
                <div style="font-size: 1rem; opacity: 0.8; margin-top: 5px;" x-text="ejercicioActivo.tipo === 'work' ? '¡A TRABAJAR!' : 'DESCANSAR'"></div>
            </div>
            
            <div class="big-text" x-text="tiempoRestante"></div>

            <div class="animation">
                <img :src="'assets/animations/' + (ejercicioActivo.animacion || 'default.gif')" alt="Animación ejercicio" style="max-width: 200px; border-radius: 10px; display: block; margin: 0 auto;"  onerror="this.style.display='none'">
            </div>
            <div style="margin-top: 40px; display: flex; width: 100%; max-width: 300px; gap: 15px;">
                <button @click="toggleTimer()" class="btn" :class="corriendo ? 'btn-red' : 'btn-green'" x-text="corriendo ? 'PAUSAR' : 'INICIAR'"></button>
                <button @click="resetTimer()" class="btn btn-gray">RESET</button>
            </div>
            
            <div style="margin-top: 30px; width: 100%; max-width: 300px;">
                <button @click="modo = 'config'" class="btn btn-outline" style="border: none; background: rgba(0,0,0,0.3);">
                    <i class="fa-solid fa-gear"></i> Editar esta rutina
                </button>
                <button @click="volverAlMenu()" class="btn btn-outline" style="margin-top: 10px;">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Menú
                </button>
            </div>
        </div>

        <!-- Pantalla de Configuración de Rutina -->
        <div x-show="modo === 'config'" class="scroll-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Editando: <span x-text="nombreRutinaActual"></span></h3>
                <button @click="modo = 'timer'" style="background: none; border: none; color: white; font-size: 1.5rem;"><i class="fa-solid fa-times"></i></button>
            </div>
            
            <div class="input-group" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; flex-direction: column;">
                <input type="text" x-model="nuevoNombreEj" placeholder="Nombre ejercicio (ej. Flexiones)">
                <input type="text" x-model="nuevoAnimacion" placeholder="Nombre de la animación (ej. flexiones.gif)">
                <div style="display: flex; gap: 5px;">
                    <input type="number" x-model="nuevoTiempoEj" placeholder="Seg." style="width: 30%;">
                    <select x-model="nuevoTipoEj">
                        <option value="work">Trabajo</option>
                        <option value="rest">Descanso</option>
                    </select>
                    <button @click="agregarEjercicio()" class="btn btn-green" style="width: auto;">+</button>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <template x-for="(ej, index) in ejerciciosActuales" :key="index">
                    <div class="item-lista">
                        <div>
                            <strong x-text="ej.nombre" :style="ej.tipo === 'rest' ? 'color: #fca5a5' : 'color: #86efac'"></strong>
                            <span class="tag" x-text="ej.tiempo + 's'"></span>
                            <span class="tag" x-text="ej.tipo === 'work' ? 'Work' : 'Rest'"></span>
                        </div>
                        <button @click="eliminarEjercicio(index)" style="background: none; border: none; color: #ccc; cursor: pointer;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </template>
                <div x-show="ejerciciosActuales.length === 0" style="text-align: center; opacity: 0.6; margin-top: 20px;">
                    Rutina vacía. Agrega ejercicios arriba.
                </div>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(console.log);
        }

        function app() {
            return {
                modo: 'menu', 
                todasLasRutinas: [], 
                rutinaActualIndex: null, 
                nombreNuevaRutina: '',
                corriendo: false,
                indiceEjercicio: 0,
                tiempoRestante: 0,
                intervalo: null,
                wakeLock: null,
                
                // Formulario
                nuevoNombreEj: '',
                nuevoTiempoEj: 30,
                nuevoTipoEj: 'work',
                nuevoAnimacion: '',

                // Audio Context
                audioCtx: null,

                get ejerciciosActuales() {
                    if (this.rutinaActualIndex === null) return [];
                    return this.todasLasRutinas[this.rutinaActualIndex].ejercicios;
                },
                get ejercicioActivo() {
                    return this.ejerciciosActuales[this.indiceEjercicio] || { nombre: '¡FIN!', tipo: 'rest' };
                },
                get nombreRutinaActual() {
                    if (this.rutinaActualIndex === null) return '';
                    return this.todasLasRutinas[this.rutinaActualIndex].nombre;
                },

                init() {
                    const guardado = localStorage.getItem('misRutinasAPP2');
                    if (guardado)
                        this.todasLasRutinas = JSON.parse(guardado);
                    else {
                        this.todasLasRutinas = [
                            { 
                                nombre: "Tabata I(4 min)", 
                                ejercicios: [
                                    // Un Tabata son 8 rondas de 20s trabajo / 10s descanso
                                    { nombre: "Preparación", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Saltos de tijera", animacion: "jumping_jack.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Burpees", animacion: "burpees.gif",tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Sentadillas",  animacion: "squats.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Flexiones", animacion: "push_up.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Saltos de tijera", animacion: "jumping_jack.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Burpees", animacion: "burpees.gif",tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Sentadillas",  animacion: "squats.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Flexiones", animacion: "push_up.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Saltos de tijera", animacion: "jumping_jack.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Burpees", animacion: "burpees.gif",tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Sentadillas",  animacion: "squats.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Flexiones", animacion: "push_up.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Saltos de tijera", animacion: "jumping_jack.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Burpees", animacion: "burpees.gif",tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Sentadillas",  animacion: "squats.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Flexiones", animacion: "push_ups.gif", tiempo: 20, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                ] 
                            },
                            {
                                nombre: "7 Min Workout",
                                ejercicios: [
                                    { nombre: "Preparación", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Saltos de tijera", animacion: "jumping_jack.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Sentadilla en Pared", animacion: "wall_sit.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Flexiones", animacion: "push_ups.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Crunch Abdominal", animacion: "crunches.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Step en Silla", animacion: "step_in_place.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Squats", animacion: "squats.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Triceps en silla", animacion: "triceps.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Tablón", animacion: "plank.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Elevaciones de rodillas", animacion: "knee_raises.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Zancada Frontal", animacion: "lunges.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Flexión y Rotación", animacion: "push_up_rotation.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Plancha en lado Izquierdo", animacion: "left_side_plank.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "Plancha en lado Derecho", animacion: "right_side_plank.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "Descanso", animacion: "rest.gif", tiempo: 10, tipo: "rest" }
                                ]
                            },
                            {
                                nombre: "Comienzo de la mañana",
                                ejercicios: [
                                    { nombre: "Preparado", animacion: "rest.gif", tiempo: 10, tipo: "rest" },
                                    { nombre: "50 Saltos flojos", animacion: "jumping_jack.gif", tiempo: 30, tipo: "work" }, 
                                    { nombre: "20 Ondas espinales", animacion: "wall_sit.gif", tiempo: 40, tipo: "work" }, 
                                    { nombre: "20 balanceo frontal de brazos", animacion: "default.gif", tiempo: 40, tipo: "work" }, 
                                    { nombre: "20 Brazos de Golfista", animacion: "crunches.gif", tiempo: 40, tipo: "work" }, 
                                    { nombre: "20 Cortes de leña", animacion: "default.gif", tiempo: 40, tipo: "work" }, 
                                    { nombre: "20 Marcha con brazos a la rodilla", animacion: "squats.gif", tiempo: 40, tipo: "work" }, 
                                    { nombre: "20 Sentadillas de Ballet", animacion: "triceps.gif", tiempo: 40, tipo: "work" }, 
                                    { nombre: "Montura de caballo", animacion: "plank.gif", tiempo: 60, tipo: "work" }
                                ]
                            }
                        ];
                    }
                },

                // --- SONIDO (Audio API) ---
                iniciarAudio() {
                    if (!this.audioCtx) {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                },
                
                beep(frecuencia = 440, duracion = 100) {
                    if (!this.audioCtx) return;
                    const oscillator = this.audioCtx.createOscillator();
                    const gainNode = this.audioCtx.createGain();
                    oscillator.type = 'sine';
                    oscillator.frequency.value = frecuencia;
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);
                    oscillator.start();
                    setTimeout(() => oscillator.stop(), duracion);
                },

                // --- WAKE LOCK (Pantalla Encendida) ---
                async activarPantalla() {
                    if ('wakeLock' in navigator) {
                        try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch (err) { console.log(err); }
                    }
                },
                async desactivarPantalla() {
                    if (this.wakeLock) { await this.wakeLock.release(); this.wakeLock = null; }
                },

                // --- GESTIÓN RUTINAS Y EJERCICIOS ---
                crearRutina() {
                    if (!this.nombreNuevaRutina) return;
                    this.todasLasRutinas.push({ nombre: this.nombreNuevaRutina, ejercicios: [] });
                    this.guardarTodo();
                    this.nombreNuevaRutina = '';
                },
                borrarRutina(index) {
                    if(confirm("¿Borrar rutina?")) { this.todasLasRutinas.splice(index, 1); this.guardarTodo(); }
                },
                cargarRutina(index) {
                    this.rutinaActualIndex = index;
                    this.indiceEjercicio = 0;
                    this.resetTimer();
                    this.modo = this.ejerciciosActuales.length === 0 ? 'config' : 'timer';
                },
                volverAlMenu() {
                    this.resetTimer();
                    this.modo = 'menu';
                    this.rutinaActualIndex = null;
                },
                agregarEjercicio() {
                    if(!this.nuevoNombreEj) return;
                    this.todasLasRutinas[this.rutinaActualIndex].ejercicios.push({
                        nombre: this.nuevoNombreEj, 
                        tiempo: parseInt(this.nuevoTiempoEj), 
                        tipo: this.nuevoTipoEj,
                        animacion: this.nuevoAnimacion
                    });
                    this.guardarTodo();
                    this.nuevoNombreEj = '';
                    this.nuevoAnimacion = '';
                },
                eliminarEjercicio(index) {
                    this.todasLasRutinas[this.rutinaActualIndex].ejercicios.splice(index, 1);
                    this.guardarTodo();
                },
                guardarTodo() {
                    localStorage.setItem('misRutinasAPP', JSON.stringify(this.todasLasRutinas));
                },

                // --- TIMER LOGIC (Con Sonidos) ---
                resetTimer() {
                    this.corriendo = false;
                    clearInterval(this.intervalo);
                    this.desactivarPantalla();
                    this.indiceEjercicio = 0;
                    if(this.ejerciciosActuales.length > 0) 
                        this.tiempoRestante = this.ejerciciosActuales[0].tiempo;
                },

                toggleTimer() {
                    if (this.ejerciciosActuales.length === 0) return alert("Rutina vacía");
                    
                    this.iniciarAudio(); // Inicializar audio al primer click

                    if (this.corriendo) {
                        this.corriendo = false;
                        clearInterval(this.intervalo);
                        this.desactivarPantalla();
                    } else {
                        this.corriendo = true;
                        this.activarPantalla();
                        this.intervalo = setInterval(() => {
                            // LOGICA DE SONIDOS
                            if (this.tiempoRestante <= 4 && this.tiempoRestante > 1) {
                                // Bip grave en 3, 2, 1 (nota: el tiempo se muestra -1 visualmente a veces por el orden, ajusta a gusto)
                                this.beep(600, 100); 
                            }

                            if (this.tiempoRestante > 0) {
                                this.tiempoRestante--;
                            } else {
                                // Bip agudo al cambiar
                                this.beep(1200, 200);
                                this.siguienteEjercicio();
                            }
                        }, 1000);
                    }
                },

                siguienteEjercicio() {
                    if (this.indiceEjercicio < this.ejerciciosActuales.length - 1) {
                        this.indiceEjercicio++;
                        this.tiempoRestante = this.ejerciciosActuales[this.indiceEjercicio].tiempo;
                        this.hablar(this.ejerciciosActuales[this.indiceEjercicio].nombre);
                    } else {
                        this.resetTimer();
                        this.hablar("Rutina terminada");
                        this.beep(800, 100); setTimeout(() => this.beep(800, 100), 200); // Doble bip final
                        alert("¡Terminado!");
                        this.modo = 'menu';
                    }
                },
                
                hablar(texto) {
                     if('speechSynthesis' in window){
                        const msg = new SpeechSynthesisUtterance(texto);
                        window.speechSynthesis.speak(msg);
                    }
                }
            }
        }
    </script>
</body>
</html>
