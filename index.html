<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIT Timer Pro</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Estilos básicos oscuros */
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        /* Utilidades */
        .hidden { display: none; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 5px; width: 100%; }
        .btn-green { background: #4ade80; color: #003300; }
        .btn-red { background: #f87171; color: #450a0a; }
        .btn-blue { background: #60a5fa; color: #1e3a8a; }
        .btn-gray { background: #4b5563; color: white; }
        
        /* Timer Styles */
        .timer-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .big-text { font-size: 6rem; font-weight: bold; margin: 0; }
        .exercise-name { font-size: 2.5rem; color: #4ade80; margin-bottom: 20px; }
        .is-rest { color: #f87171; }

        /* Form Styles */
        .form-container { max-width: 600px; margin: 0 auto; width: 100%; overflow-y: auto; }
        .input-group { margin-bottom: 10px; display: flex; gap: 10px; }
        input, select { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; width: 100%; }
        .lista-ejercicios { margin-top: 20px; text-align: left; }
        .item-lista { background: #333; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div x-data="app()" class="app-wrapper" style="height: 100%;">
        
        <div x-show="modo === 'timer'" class="timer-container">
            <div class="exercise-name" :class="ejercicioActual.tipo === 'rest' ? 'is-rest' : ''">
                <span x-text="ejercicioActual.nombre"></span>
            </div>
            
            <div class="big-text" x-text="tiempoRestante"></div>
            
            <div style="margin-top: 30px; display: flex; width: 100%; max-width: 300px;">
                <button @click="toggleTimer()" class="btn btn-green" x-text="corriendo ? 'PAUSAR' : 'INICIAR'"></button>
                <button @click="reset()" class="btn btn-gray">RESET</button>
            </div>
            
            <button @click="modo = 'config'" class="btn btn-blue" style="margin-top: 20px; max-width: 300px;">
                <i class="fa-solid fa-gear"></i> Editar Rutina
            </button>
        </div>

        <div x-show="modo === 'config'" class="form-container">
            <h2>Configurar Rutina</h2>
            
            <div class="input-group">
                <input type="text" x-model="nuevoNombre" placeholder="Nombre (ej. Burpees)">
            </div>
            <div class="input-group">
                <input type="number" x-model="nuevoTiempo" placeholder="Segundos" style="width: 30%;">
                <select x-model="nuevoTipo">
                    <option value="work">Trabajo</option>
                    <option value="rest">Descanso</option>
                </select>
                <button @click="agregarEjercicio()" class="btn btn-green" style="width: auto;">+</button>
            </div>

            <div class="lista-ejercicios">
                <template x-for="(ej, index) in ejercicios" :key="index">
                    <div class="item-lista">
                        <div>
                            <strong x-text="ej.nombre"></strong>
                            <span x-text="'(' + ej.tiempo + 's)'" style="font-size: 0.8em; color: #ccc;"></span>
                        </div>
                        <button @click="eliminarEjercicio(index)" style="background: none; border: none; color: #f87171; cursor: pointer;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </template>
            </div>

            <div style="margin-top: 20px;">
                <button @click="guardarYVolver()" class="btn btn-blue">Guardar y Entrenar</button>
                <button @click="restaurarDefault()" class="btn btn-gray" style="font-size: 0.8rem;">Restaurar Ejemplo</button>
            </div>
        </div>

    </div>

    <script>
        function app() {
            return {
                modo: 'timer', // 'timer' o 'config'
                corriendo: false,
                indice: 0,
                tiempoRestante: 0,
                intervalo: null,
                
                // Variables para el formulario
                nuevoNombre: '',
                nuevoTiempo: 30,
                nuevoTipo: 'work',

                // Datos iniciales
                ejercicios: [],

                get ejercicioActual() {
                    return this.ejercicios[this.indice] || { nombre: 'Fin', tipo: 'rest' };
                },

                init() {
                    // Intentar cargar de LocalStorage al iniciar
                    const guardado = localStorage.getItem('miRutinaHIIT');
                    if (guardado) {
                        this.ejercicios = JSON.parse(guardado);
                    } else {
                        this.restaurarDefault();
                    }
                    this.reset();
                },

                // --- Lógica del Timer ---
                reset() {
                    this.corriendo = false;
                    clearInterval(this.intervalo);
                    this.indice = 0;
                    if(this.ejercicios.length > 0) 
                        this.tiempoRestante = this.ejercicios[0].tiempo;
                },

                toggleTimer() {
                    if (this.ejercicios.length === 0) return alert("Agrega ejercicios primero");
                    
                    if (this.corriendo) {
                        this.corriendo = false;
                        clearInterval(this.intervalo);
                    } else {
                        this.corriendo = true;
                        this.intervalo = setInterval(() => {
                            if (this.tiempoRestante > 0) {
                                this.tiempoRestante--;
                            } else {
                                this.siguienteEjercicio();
                            }
                        }, 1000);
                    }
                },

                siguienteEjercicio() {
                    if (this.indice < this.ejercicios.length - 1) {
                        this.indice++;
                        this.tiempoRestante = this.ejercicios[this.indice].tiempo;
                        this.hablar(this.ejercicios[this.indice].nombre);
                    } else {
                        this.corriendo = false;
                        clearInterval(this.intervalo);
                        this.hablar("Rutina terminada");
                        alert("¡Terminado!");
                    }
                },

                hablar(texto) {
                    if('speechSynthesis' in window){
                        const msg = new SpeechSynthesisUtterance(texto);
                        window.speechSynthesis.speak(msg);
                    }
                },

                // --- Lógica de Gestión (CRUD + LocalStorage) ---
                agregarEjercicio() {
                    if(!this.nuevoNombre) return;
                    this.ejercicios.push({
                        nombre: this.nuevoNombre,
                        tiempo: parseInt(this.nuevoTiempo),
                        tipo: this.nuevoTipo
                    });
                    this.nuevoNombre = ''; // Limpiar input
                },

                eliminarEjercicio(index) {
                    this.ejercicios.splice(index, 1);
                },

                guardarYVolver() {
                    // AQUÍ ESTÁ LA MAGIA DE LOCALSTORAGE
                    localStorage.setItem('miRutinaHIIT', JSON.stringify(this.ejercicios));
                    this.reset();
                    this.modo = 'timer';
                },

                restaurarDefault() {
                    this.ejercicios = [
                        { nombre: "Preparados", tiempo: 10, tipo: "rest" },
                        { nombre: "Jumping Jacks", tiempo: 30, tipo: "work" },
                        { nombre: "Descanso", tiempo: 10, tipo: "rest" }
                    ];
                }
            }
        }
    </script>
</body>
</html>
